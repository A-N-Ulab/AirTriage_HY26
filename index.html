<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon-square.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AirTriage — Coming Soon</title>
    <meta name="description" content="AirTriage. Big coming soon." />
    <meta name="theme-color" content="#fef2e4" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="preconnect" href="https://www.youtube-nocookie.com" />
    <link rel="dns-prefetch" href="https://i.ytimg.com" />
    <script>
      // Marks that JS is available so the coming-soon screen can stay hidden
      // behind the intro instead of flashing on first paint.
      document.documentElement.classList.add('js')
    </script>
  </head>
  <body>
    <div id="app">
      <main class="demo-shell" data-demo-shell data-state="loading" aria-busy="true">
        <div class="demo-shell__mount" data-demo-mount></div>

        <section class="demo-shell__status" aria-live="polite" aria-atomic="true">
          <p class="demo-shell__eyebrow">AirTriage / terrain study 01</p>
          <h1 class="demo-shell__title" data-demo-title>Loading demo</h1>
          <p class="demo-shell__message" data-demo-message>Preparing the experience...</p>
          <progress class="demo-shell__progress" data-demo-progress max="100" value="0">0%</progress>
          <button class="demo-shell__retry" data-demo-retry type="button">Retry</button>
        </section>

        <section class="coming-soon" aria-label="AirTriage coming soon">
          <span class="coming-soon__rule" aria-hidden="true"></span>
          <h1 class="coming-soon__title">BIG COMING SOON ...</h1>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
